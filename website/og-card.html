<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>OG Card ZAD</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; }
  body {
    font-family:'Cairo','Segoe UI',Tahoma,sans-serif;
    background:#070e20;
    color:#eef3fb;
    overflow:hidden;
    position:relative;
  }
  .bg {
    position:absolute; inset:0;
    background:
      radial-gradient(520px 340px at 88% 0%, rgba(16,185,129,0.22), transparent 65%),
      radial-gradient(460px 320px at 0% 100%, rgba(212,175,55,0.14), transparent 60%),
      radial-gradient(420px 300px at 8% 0%, rgba(124,156,255,0.14), transparent 60%),
      linear-gradient(135deg,#0a1428,#071122);
  }
  .grid {
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(139,161,199,0.10) 1.5px, transparent 1.5px);
    background-size:40px 40px;
  }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:70px 80px; gap:60px; }
  .left { flex:0 0 auto; }
  .icon {
    width:250px; height:250px; border-radius:60px;
    box-shadow:0 24px 70px rgba(2,6,16,0.6), 0 0 0 1px rgba(139,161,199,0.2), 0 0 90px rgba(16,185,129,0.25);
  }
  .right { flex:1; }
  .tagline {
    display:inline-block;
    background:rgba(16,185,129,0.16);
    border:1px solid rgba(16,185,129,0.4);
    color:#5ce8a9;
    font-weight:700; font-size:30px;
    padding:12px 30px; border-radius:999px;
    margin-bottom:34px;
  }
  h1 { font-size:104px; font-weight:900; line-height:1.15; letter-spacing:-2px; }
  h1 .gr { background:linear-gradient(135deg,#10b981,#0ea5e9); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 .gold { color:#d4af37; }
  .desc { margin-top:28px; font-size:40px; color:#c3d2ec; font-weight:600; }
  .badge {
    display:flex; align-items:center; gap:22px;
    margin-top:48px;
  }
  .chip {
    display:inline-flex; align-items:center; gap:14px;
    background:#04120c; border:1px solid rgba(255,255,255,0.18);
    border-radius:18px; padding:18px 30px;
    font-size:30px; font-weight:800;
  }
  .chip .p { color:#5ce8a9; }
  .chip .g { color:#d4af37; }
  .foot { position:absolute; bottom:36px; inset-inline:80px; display:flex; justify-content:space-between;
    color:#8ba1c7; font-size:28px; font-weight:700; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <img class="icon" src="assets/app-icon-512.png" alt="">
    </div>
    <div class="right">
      <span class="tagline">● تطبيق إسلامي متكامل</span>
      <h1>زاد<br>رفيقك في <span class="gr">القرآن</span></h1>
      <div class="desc">قرآن · أذكار · مواقيت الصلاة · القبلة · حصن المسلم</div>
      <div class="badge">
        <span class="chip">👇 <span class="p">مجاني</span></span>
        <span class="chip">🔒 <span class="g">بلا إعلانات</span></span>
      </div>
    </div>
  </div>
  <div class="foot">
    <span>زاد · ZAD</span>
    <span id="url">zad-islamic.github.io/ZAD-ISLAMIC</span>
  </div>
</body>
</html>
