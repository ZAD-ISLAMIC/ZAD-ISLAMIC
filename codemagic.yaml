workflows:
  android-release:
    name: ZAD Android Release

    max_build_duration: 120

    environment:
      node: 20.19.0
      java: 21

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web assets
        script: |
          npm run build

      - name: Build Android AAB
        script: |
          npm run build:aab:release

      - name: Build Android APK
        script: |
          npm run build:apk:release

    artifacts:
      - "**/*.apk"
      - "**/*.aab"
