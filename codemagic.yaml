workflows:
  android-release:
    name: ZAD Android Release

    max_build_duration: 120

    environment:
      node: 20.19.0
      java: 21

      android_signing:
        - zad_release

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Create build.json from Codemagic signing credentials
        script: |
          node <<'NODE'
          const fs = require('fs');

          const buildConfig = {
            android: {
              release: {
                keystore: process.env.CM_KEYSTORE_PATH,
                storePassword: process.env.CM_KEYSTORE_PASSWORD,
                alias: process.env.CM_KEY_ALIAS,
                password: process.env.CM_KEY_PASSWORD,
                keystoreType: "pkcs12",
                packageType: "apk"
              }
            }
          };

          fs.writeFileSync(
            'build.json',
            JSON.stringify(buildConfig, null, 2) + '\n'
          );

          console.log('build.json created successfully');
          NODE

      - name: Build Android AAB
        script: |
          npm run build:aab:release

      - name: Build Android APK
        script: |
          npm run build:apk:release

    artifacts:
      - "platforms/android/app/build/outputs/**/*.apk"
      - "platforms/android/app/build/outputs/**/*.aab"
